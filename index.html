<script>
/* ファイルの新旧が まざっていたら、じぶんで さいしん版を とりなおして 1回だけ 読みこみなおす */
(function () {
  var EXPECT = '2026-10-16.74', B = window.FILE_BUILD || {};
  var bad = ['data', 'avatar', 'myroom', 'i18n-ko', 'i18n', 'app'].filter(function (k) { return B[k] !== EXPECT; });
  if (!bad.length) return;
  try { if (sessionStorage.getItem('kuku-healed') === EXPECT) return; sessionStorage.setItem('kuku-healed', EXPECT); } catch (e) { return; }
  var files = ['index.html', 'style.css', 'data.js', 'avatar.js', 'myroom.js', 'i18n-ko.js', 'i18n.js', 'app.js', 'sw.js', 'manifest.json'];
  (async function () {
    try { var regs = await navigator.serviceWorker.getRegistrations(); for (var i = 0; i < regs.length; i++) await regs[i].unregister(); var ks = await caches.keys(); for (var j = 0; j < ks.length; j++) await caches.delete(ks[j]); } catch (e) { /* 無視 */ }
    try { await Promise.all(files.map(function (f) { return fetch(f, { cache: 'reload' }); })); } catch (e) { /* 無視 */ }
    location.reload();
  })();
})();
</script>
